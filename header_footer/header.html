	<script>
  // Script untuk hamburger menu
  const hamburger = document.querySelector('#hamburger');
  const navMenu = document.querySelector('#nav-menu');

  hamburger.addEventListener('click', function () {
    hamburger.classList.toggle('hamburger-active');
    navMenu.classList.toggle('hidden');
  });

  // Script untuk menandai link navigasi yang aktif
  const currentPage = window.location.pathname.split('/').pop();
  const navLinks = document.querySelectorAll('nav a.nav-link');

  navLinks.forEach(link => {
    const linkPage = link.getAttribute('href').split('/').pop().split('#')[0];
    // Jika halaman saat ini cocok dengan link, atau jika halaman utama dan link ke index.html
    if (linkPage === currentPage || (currentPage === '' && linkPage === 'index.html')) {
      link.classList.remove('text-secondary', 'group-hover:text-primary');
      link.classList.add('text-dark', 'group-hover:text-dark');
    }
  });
</script>
